<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Conversation cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400&display=swap" rel="stylesheet" />
    <!-- Inline, so the loading spinner shows before any script or stylesheet arrives. -->
    <style>
      .page-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .page-loading::after {
        content: '';
        width: 2rem;
        height: 2rem;
        border: 3px solid rgb(128 128 128 / 0.25);
        border-top-color: rgb(128 128 128);
        border-radius: 50%;
        animation: page-loading-spin 0.8s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .page-loading::after {
          animation-duration: 2.4s;
        }
      }
      @keyframes page-loading-spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <!-- React replaces this on its first render; until then, the page shows it's loading. -->
    <div id="root"><div class="page-loading" role="status" aria-label="Loading"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
